<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F7F9;--ink:#1E2433;--muted:#59627A;--line:#D5DAE4;--action:#00719E;--c:#00AEEF;--m:#EC008C;--y:#FFF200}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
main{max-width:760px;margin:auto;padding:18px}
h1{font-size:1.5rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.flt{font:inherit;font-size:.85rem;font-weight:600;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--muted)}
.flt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--c);outline-offset:2px}
label{display:grid;gap:5px;font-weight:600;margin-bottom:14px}
.btn{font:inherit;font-weight:700;background:var(--action);color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.line{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.err{color:#B00020;font-weight:600}
/* كروت الطلبات */
.order{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:8px;padding:14px;margin-bottom:12px}
.order.printing{border-inline-start-color:var(--y)}
.order.ready{border-inline-start-color:var(--m)}
.order.done{opacity:.55;border-inline-start-color:var(--line)}
.ohead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.oid{font-weight:700;font-size:1.1rem;direction:ltr;font-variant-numeric:tabular-nums}
.odate{color:var(--muted);font-size:.85rem}
.obadge{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;margin-inline-start:6px}
.badge-color{background:#E3F4FF;color:#005A80}
.badge-bw{background:#F0F0F0;color:#333}
.badge-scan{background:#FFF4E0;color:#7A4500}
.badge-bind{background:#F0EBF8;color:#4A2080}
.oinfo{margin:6px 0;font-size:.95rem}
.odetail{color:var(--muted);font-size:.88rem;margin:2px 0}
.onotes{color:var(--muted);font-size:.88rem;margin-top:4px;font-style:italic}
.ototal{font-weight:700;margin-top:6px}
.acts{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="login" class="card">
  <h1>دخول الإدارة</h1>
  <p style="color:var(--muted)">للمسؤول عن المكتبة فقط.</p>
  <form id="lf">
    <label>البريد الإلكتروني<input id="em" type="email" autocomplete="username" required dir="ltr"></label>
    <label>كلمة المرور<input id="pw" type="password" autocomplete="current-password" required dir="ltr"></label>
    <p class="err" id="le" role="alert"></p>
    <button class="btn" type="submit">دخول</button>
  </form>
</section>

<section id="app" hidden>
  <div class="top">
    <h1>الطلبات <span style="color:var(--muted);font-size:1rem" id="cnt"></span></h1>
    <button class="btn line" id="out" type="button">خروج</button>
  </div>
  <!-- فلاتر الحالة -->
  <div class="filters">
    <button class="flt on" data-f="all">الكل</button>
    <button class="flt" data-f="new">جديد</button>
    <button class="flt" data-f="printing">قيد الطباعة</button>
    <button class="flt" data-f="ready">جاهز</button>
    <button class="flt" data-f="done">تم التسليم</button>
  </div>
  <p class="err" id="ae" role="alert"></p>
  <div id="list"></div>
</section>
</main>

<script type="module">
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyAeYbn5eMh78WgYDU5bRute1gUOln8YzGc",
  authDomain:"print-shop-system-915d8.firebaseapp.com",
  projectId:"print-shop-system-915d8",
  storageBucket:"print-shop-system-915d8.firebasestorage.app",
  messagingSenderId:"768324514085",
  appId:"1:768324514085:web:33c47dd30159e335282acc"
};
const V = "https://www.gstatic.com/firebasejs/10.12.2/";
const {initializeApp} = await import(V+"firebase-app.js");
const A = await import(V+"firebase-auth.js");
const F = await import(V+"firebase-firestore.js");
const app = initializeApp(FIREBASE_CONFIG), auth = A.getAuth(app), db = F.getFirestore(app);
const $ = id => document.getElementById(id);

const SVC   = {color:"طباعة ملونة", bw:"أبيض وأسود", scan:"تصوير", bind:"تغليف"};
const BADGE = {color:"badge-color",  bw:"badge-bw",    scan:"badge-scan", bind:"badge-bind"};
const STATUS = {new:"جديد", printing:"قيد الطباعة", ready:"جاهز للاستلام", done:"تم التسليم"};
const PAPER  = {normal:"ورق عادي", glossy:"ورق لامع"};
const SIDES  = {single:"وجه واحد", double:"وجهين"};
const BIND   = {plastic:"بلاستيك", carton:"كرتون", premium:"فاخر"};

let unsub = null, allOrders = [], activeFilter = "all";

const waNum = p => { let d=String(p).replace(/\D/g,""); if(d.startsWith("0")) d="249"+d.slice(1); return d; };
function waMsg(o){
  const n = Number(o.total).toLocaleString("en-US");
  const svc = SVC[o.service] || "الطلب";
  if(o.status==="ready")    return `مرحباً ${o.name}، طلبك رقم ${o.id} (${svc}) جاهز للاستلام. الإجمالي: ${n} جنيه.`;
  if(o.status==="printing") return `مرحباً ${o.name}، طلبك رقم ${o.id} (${svc}) قيد الطباعة الآن.`;
  if(o.status==="done")     return `مرحباً ${o.name}، طلبك رقم ${o.id} تم تسليمه. شكراً لك.`;
  return `مرحباً ${o.name}، استلمنا طلبك رقم ${o.id} (${svc}). الإجمالي: ${n} جنيه.`;
}

function detailLine(d){
  if(d.service==="scan") return `${d.pages||"—"} صفحة تصوير`;
  if(d.service==="bind") return `${BIND[d.bindType]||d.bindType||"—"} × ${d.bindCount||1} ملف`;
  const pages = d.pages||"—", copies = d.copies||"—", size = d.size||"A4";
  const paper = PAPER[d.paper]||d.paper||"", sides = SIDES[d.sides]||d.sides||"";
  return `${pages} صفحة × ${copies} نسخة • ${size} • ${paper} • ${sides}`;
}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

function card(id, d){
  const o={id,...d}, svc=d.service||"color";
  const box=el("article","order "+(d.status||"new"));

  // رأس الكارت
  const head=el("div","ohead");
  const idSpan=el("span","oid",id);
  const badge=el("span","obadge "+BADGE[svc],SVC[svc]||svc);
  idSpan.append(badge);
  const date=el("span","odate",d.createdAt?d.createdAt.toDate().toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"}):"");
  head.append(idSpan,date);

  // معلومات العميل
  const info=el("div","oinfo",d.name+" • "+d.phone);
  const detail=el("div","odetail",detailLine(d));
  const total=el("div","ototal","الإجمالي: "+Number(d.total).toLocaleString("en-US")+" جنيه");
  box.append(head,info,detail,total);
  if(d.notes) box.append(el("div","onotes","ملاحظة: "+d.notes));

  // الأفعال: تغيير الحالة + واتساب
  const acts=el("div","acts");
  const sel=el("select");
  for(const k in STATUS){const op=el("option","",STATUS[k]);op.value=k;sel.append(op);}
  sel.value=d.status||"new";
  sel.onchange=async()=>{
    try{await F.updateDoc(F.doc(db,"orders",id),{status:sel.value});$("ae").textContent="";}
    catch(e){$("ae").textContent="تعذر تحديث الحالة.";sel.value=d.status||"new";}
  };
  const wa=el("a","btn","واتساب");
  wa.target="_blank";wa.rel="noopener";
  const updateWa=()=>{o.status=sel.value;wa.href="https://wa.me/"+waNum(d.phone)+"?text="+encodeURIComponent(waMsg(o));};
  updateWa(); sel.addEventListener("change",updateWa);
  acts.append(sel,wa); box.append(acts);
  return box;
}

function renderList(){
  const list=$("list"); list.replaceChildren();
  const filtered=activeFilter==="all"?allOrders:allOrders.filter(o=>o.d.status===activeFilter);
  filtered.forEach(({id,d})=>list.append(card(id,d)));
  $("cnt").textContent="("+filtered.length+")";
  $("ae").textContent=filtered.length?"":"لا توجد طلبات.";
}

function listen(){
  const q=F.query(F.collection(db,"orders"),F.orderBy("createdAt","desc"),F.limit(100));
  unsub=F.onSnapshot(q,snap=>{
    allOrders=[];
    snap.forEach(s=>allOrders.push({id:s.id,d:s.data()}));
    renderList();
  },()=>{$("ae").textContent="ليس لديك صلاحية قراءة الطلبات.";});
}

// فلاتر الحالة
document.querySelectorAll(".flt").forEach(b=>b.onclick=()=>{
  activeFilter=b.dataset.f;
  document.querySelectorAll(".flt").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  renderList();
});

A.onAuthStateChanged(auth,u=>{
  $("login").hidden=!!u; $("app").hidden=!u;
  if(u) listen(); else if(unsub){unsub();unsub=null;}
});
$("lf").onsubmit=async e=>{
  e.preventDefault();$("le").textContent="";
  try{await A.signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);}
  catch(er){$("le").textContent="البريد أو كلمة المرور غير صحيحة.";}
};
$("out").onclick=()=>A.signOut(auth);
</script>
</body>
</html>
