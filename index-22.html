<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طباعة ملونة | Color Printing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F7F9;--ink:#1E2433;--muted:#59627A;--line:#D5DAE4;--action:#00719E;--c:#00AEEF;--m:#EC008C;--y:#FFF200;--white:#fff}
*{box-sizing:border-box}
html{scroll-padding-bottom:110px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;max-width:980px;margin:auto}
.brand{font-weight:700;font-size:1.05rem}
.lang{font:inherit;font-weight:600;background:none;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:4px 16px;cursor:pointer}
main{max-width:980px;margin:auto;padding:0 18px}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.2;margin:8px 0 8px}
.sub{color:var(--muted);max-width:52ch;margin:0 0 22px}
.layout{display:grid;gap:22px}
@media(min-width:860px){.layout{grid-template-columns:1.25fr 1fr;align-items:start}.ticket{position:sticky;top:16px}}
form{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px}
label{display:grid;gap:5px;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
.hp{position:absolute;inset-inline-start:-9999px;height:0;overflow:hidden}
.ticket{background:var(--white);border:1.5px dashed var(--ink);border-radius:4px;padding:0 18px 18px}
.strip{display:flex;height:12px;margin:0 -18px 14px}
.strip i{flex:1}.strip i:nth-child(1){background:var(--c)}.strip i:nth-child(2){background:var(--m)}.strip i:nth-child(3){background:var(--y)}.strip i:nth-child(4){background:var(--ink)}
.ticket h2{font-size:1.05rem;margin:0 0 10px}
.ticket dl{margin:0}
.ticket .ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:.93rem}
.ticket dt{color:var(--muted)}.ticket dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:.85rem;color:var(--muted);margin:12px 0 0}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--ink);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:5}
.bar small{display:block;opacity:.75;font-size:.8rem}
.bar strong{font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--y)}
.btn{font:inherit;font-weight:700;background:var(--y);color:var(--ink);border:0;border-radius:6px;padding:12px 22px;cursor:pointer;min-height:46px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.alt{background:var(--action);color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.btn.line{background:none;border:1.5px solid var(--ink);color:var(--ink)}
#err{color:#B00020;font-weight:600;margin:0}
#done{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:24px}
#done[hidden],form[hidden],#err[hidden],.bar[hidden]{display:none}
.code{font-size:2.4rem;font-weight:700;letter-spacing:.06em;direction:ltr;text-align:start;margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><span class="brand" id="brand"></span><button class="lang" id="lang" type="button"></button></header>
<main>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="sub"></p>

<div class="layout" id="layout">
<form id="f" novalidate>
  <label><span data-i18n="name"></span><input id="name" autocomplete="name" required maxlength="60"></label>
  <label><span data-i18n="phone"></span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" dir="ltr" placeholder="249XXXXXXXXX"></label>
  <div class="row">
    <label><span data-i18n="pages"></span><input id="pages" type="number" inputmode="numeric" min="1" max="2000" value="10"></label>
    <label><span data-i18n="copies"></span><input id="copies" type="number" inputmode="numeric" min="1" max="500" value="1"></label>
  </div>
  <div class="row">
    <label><span data-i18n="size"></span><select id="size"><option value="A4">A4</option><option value="A3">A3</option></select></label>
    <label><span data-i18n="paper"></span><select id="paper"><option value="normal" data-i18n="normal"></option><option value="glossy" data-i18n="glossy"></option></select></label>
  </div>
  <label><span data-i18n="sides"></span><select id="sides"><option value="single" data-i18n="single"></option><option value="double" data-i18n="double"></option></select></label>
  <label><span data-i18n="notes"></span><textarea id="notes" maxlength="300"></textarea></label>
  <div class="hp" aria-hidden="true"><label>Website<input id="site" tabindex="-1" autocomplete="off"></label></div>
  <p id="err" role="alert" hidden></p>
  <p class="hint" data-i18n="fileHint"></p>
</form>

<aside class="ticket" aria-live="polite">
  <div class="strip"><i></i><i></i><i></i><i></i></div>
  <h2 data-i18n="ticket"></h2>
  <dl>
    <div class="ln"><dt data-i18n="rSides"></dt><dd id="rSides"></dd></div>
    <div class="ln"><dt data-i18n="rPrint"></dt><dd id="rPrint"></dd></div>
    <div class="ln" id="rPaperRow"><dt data-i18n="rPaper"></dt><dd id="rPaper"></dd></div>
  </dl>
  <p class="note" data-i18n="sample"></p>
</aside>
</div>

<section id="done" hidden>
  <h2 data-i18n="doneTitle"></h2>
  <p data-i18n="doneText"></p>
  <div class="code" id="code"></div>
  <div class="acts">
    <a class="btn alt" id="wa" hidden target="_blank" rel="noopener" data-i18n="sendFile"></a>
    <button class="btn line" id="copy" type="button" data-i18n="copy"></button>
    <button class="btn line" id="again" type="button" data-i18n="again"></button>
  </div>
</section>
</main>

<div class="bar" id="bar">
  <div><small data-i18n="total"></small><strong id="total">0</strong></div>
  <button class="btn" id="send" type="submit" form="f" data-i18n="submit"></button>
</div>

<script type="module">
/* ===== إعدادات المكتبة (عدّلها هنا) ===== */
const SHOP = { nameAr: "مكتبة الطباعة", nameEn: "Print Shop", whatsapp: "249XXXXXXXXX" };
const PRICES = { size: { A4: 300, A3: 600 }, paper: { normal: 0, glossy: 100 } }; // أسعار تجريبية لكل صفحة/ورقة
const FIREBASE_CONFIG = { apiKey: "PASTE_HERE", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
/* ======================================== */

const T = {
ar:{title:"اطبع ملفاتك بالألوان",sub:"املأ الطلب، شوف السعر فوراً، وبعدها ارسل ملفك بالواتساب برقم طلبك.",name:"الاسم",phone:"رقم الواتساب",pages:"عدد الصفحات",copies:"عدد النسخ",size:"حجم الورق",paper:"نوع الورق",sides:"الطباعة",normal:"عادي",glossy:"لامع",single:"وجه واحد",double:"وجهين",notes:"ملاحظات (اختياري)",fileHint:"الملف نفسه ترسله بالواتساب بعد ما تاخد رقم الطلب.",ticket:"فاتورة مبدئية",rSides:"عدد الصفحات المطبوعة",rPrint:"سعر الطباعة",rPaper:"إضافة الورق",sample:"الأسعار تجريبية وتتغير حسب المكتبة.",total:"الإجمالي",submit:"أرسل الطلب",sending:"جاري الإرسال...",cur:"جنيه",doneTitle:"وصل طلبك",doneText:"رقم طلبك هو:",sendFile:"ارسل الملف بالواتساب",copy:"انسخ الرقم",copied:"تم النسخ",again:"طلب جديد",eName:"اكتب اسمك.",ePhone:"اكتب رقم واتساب صحيح (9 أرقام على الأقل).",eNum:"عدد الصفحات والنسخ لازم يكونا أرقاماً صحيحة.",eDb:"الموقع لم يُربط بقاعدة البيانات بعد.",eFail:"ما قدرنا نرسل الطلب. تأكد من الاتصال وحاول مرة ثانية.",eWait:"انتظر ثواني قبل إرسال طلب جديد.",waMsg:"مرحباً، رقم طلبي "},
en:{title:"Print your files in color",sub:"Fill in the order, see the price at once, then send your file on WhatsApp with your order number.",name:"Name",phone:"WhatsApp number",pages:"Pages",copies:"Copies",size:"Paper size",paper:"Paper type",sides:"Printing",normal:"Standard",glossy:"Glossy",single:"Single-sided",double:"Double-sided",notes:"Notes (optional)",fileHint:"You send the file itself on WhatsApp after you get your order number.",ticket:"Estimate",rSides:"Printed pages",rPrint:"Printing",rPaper:"Paper extra",sample:"Prices are samples and change per shop.",total:"Total",submit:"Send order",sending:"Sending...",cur:"SDG",doneTitle:"Order received",doneText:"Your order number is:",sendFile:"Send file on WhatsApp",copy:"Copy number",copied:"Copied",again:"New order",eName:"Enter your name.",ePhone:"Enter a valid WhatsApp number (at least 9 digits).",eNum:"Pages and copies must be whole numbers.",eDb:"The site is not connected to the database yet.",eFail:"Could not send the order. Check your connection and try again.",eWait:"Wait a few seconds before sending another order.",waMsg:"Hello, my order number is "}
};
const $ = id => document.getElementById(id);
let lang = "ar";
try { lang = localStorage.getItem("lang") || "ar"; } catch (e) {}
const fmt = n => Number(n).toLocaleString("en-US");
const num = id => { const v = Number($(id).value); return Number.isInteger(v) ? v : 0; };

function calc() {
  const pages = num("pages"), copies = num("copies");
  const ok = pages >= 1 && pages <= 2000 && copies >= 1 && copies <= 500;
  const p = ok ? pages * copies : 0;
  const sheets = ok ? ($("sides").value === "double" ? Math.ceil(pages / 2) : pages) * copies : 0;
  const print = p * PRICES.size[$("size").value];
  const extra = sheets * PRICES.paper[$("paper").value];
  return { ok, pages, copies, p, print, extra, total: print + extra };
}
function render() {
  const t = T[lang], c = calc();
  $("rSides").textContent = fmt(c.p);
  $("rPrint").textContent = fmt(c.print) + " " + t.cur;
  $("rPaper").textContent = fmt(c.extra) + " " + t.cur;
  $("rPaperRow").hidden = c.extra === 0;
  $("total").textContent = fmt(c.total) + " " + t.cur;
}
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  $("brand").textContent = lang === "ar" ? SHOP.nameAr : SHOP.nameEn;
  $("lang").textContent = lang === "ar" ? "English" : "عربي";
  document.title = $("brand").textContent;
  render();
}
$("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang(); };
["pages", "copies", "size", "paper", "sides"].forEach(id => $(id).addEventListener("input", render));

function showErr(msg) { const e = $("err"); e.textContent = msg; e.hidden = !msg; }
function makeId() { return "P" + Date.now().toString(36).slice(-5).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase(); }
let db;
async function getDb() {
  if (db) return db;
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  const { initializeApp } = await import(V + "firebase-app.js");
  const fs = await import(V + "firebase-firestore.js");
  db = { fs, d: fs.getFirestore(initializeApp(FIREBASE_CONFIG)) };
  return db;
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const t = T[lang], c = calc(), name = $("name").value.trim(), phone = $("phone").value.replace(/[\s-]/g, "");
  showErr("");
  if (name.length < 2) return showErr(t.eName);
  if (!/^\+?\d{9,15}$/.test(phone)) return showErr(t.ePhone);
  if (!c.ok) return showErr(t.eNum);
  if ($("site").value) return finish(makeId());               // فخ السبام
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE")) return showErr(t.eDb);
  try { if (Date.now() - Number(localStorage.getItem("lastOrder") || 0) < 30000) return showErr(t.eWait); } catch (e) {}
  const btn = $("send"); btn.disabled = true; btn.textContent = t.sending;
  const id = makeId();
  try {
    const { fs, d } = await getDb();
    await fs.setDoc(fs.doc(d, "orders", id), {
      name, phone, pages: c.pages, copies: c.copies, size: $("size").value, paper: $("paper").value,
      sides: $("sides").value, notes: $("notes").value.trim().slice(0, 300), total: c.total,
      status: "new", createdAt: fs.serverTimestamp()
    });
    try { localStorage.setItem("lastOrder", String(Date.now())); } catch (e) {}
    finish(id);
  } catch (e) { console.error(e); showErr(t.eFail); }
  btn.disabled = false; btn.textContent = t.submit;
});

function finish(id) {
  $("layout").hidden = true; $("bar").hidden = true; $("done").hidden = false;
  $("code").textContent = id;
  const wa = $("wa");
  if (/^\d{8,15}$/.test(SHOP.whatsapp)) {
    wa.href = "https://wa.me/" + SHOP.whatsapp + "?text=" + encodeURIComponent(T[lang].waMsg + id);
    wa.hidden = false;
  }
  window.scrollTo(0, 0);
}
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("code").textContent); $("copy").textContent = T[lang].copied; } catch (e) {}
};
$("again").onclick = () => {
  $("done").hidden = true; $("layout").hidden = false; $("bar").hidden = false;
  $("copy").textContent = T[lang].copy; $("f").reset(); render();
};
applyLang();
</script>
</body>
</html>
